[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
lib_deps =
  sandeepmistry/LoRa@^0.8.0
  Wire
build_flags =
  -I../include
  -I../protocol/include

[env:sx1276_bench]
extends = env:teensy41
build_flags =
  ${env:teensy41.build_flags}
  -D NURA_SENDER_SPARKFUN_SX1276_BENCH=1
