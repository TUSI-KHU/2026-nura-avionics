[platformio]
default_envs = gps_standalone

[env:gps_standalone]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = custom
upload_command = python3 ../../tools/platformio_teensy_upload_retry.py $SOURCE
lib_deps =
  mikalhart/TinyGPSPlus@^1.1.0
build_flags =
  -I../../include
