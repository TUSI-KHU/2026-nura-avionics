; NURA flight-controller build matrix.
; Keep only the flight/debug builds and their no-LoRa variants here.

[platformio]
default_envs = main

[teensy_upload_retry]
upload_protocol = custom
upload_command = python3 tools/platformio_teensy_upload_retry.py $SOURCE

[env]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = ${teensy_upload_retry.upload_protocol}
upload_command = ${teensy_upload_retry.upload_command}
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit LSM6DS@^4.7.4
  adafruit/Adafruit LIS3MDL@^1.2.5
  adafruit/Adafruit LIS331@^1.0.6
  adafruit/Adafruit MPL3115A2 Library@^2.1.2
  mikalhart/TinyGPSPlus@^1.1.0
  jgromes/RadioLib@7.7.1
  sandeepmistry/LoRa@^0.8.0
build_src_filter =
  +<*>
  -<hal/bmp180_hal.cpp>
  -<hal/lsm6dsox_hal.cpp>
  -<hal/mock_flight_data_hal.cpp>
  -<test_support/mock_telemetry_source_task.cpp>
build_flags =
  -D NURA_ENABLE_PYRO_OUTPUTS=1
  -I protocol/include

; Flight application with LoRa, program flash logging, and microSD mirror enabled.
[env:main]
build_flags =
  ${env.build_flags}
  -D LOG_LEVEL=0
  -D NURA_USE_SX127X_LORA=1
  -D NURA_FLIGHT_PCB_SX127X=1

; Same application configuration with Serial diagnostics enabled.
[env:debug]
build_flags =
  ${env.build_flags}
  -D LOG_LEVEL=3
  -D NURA_USE_SX127X_LORA=1
  -D NURA_FLIGHT_PCB_SX127X=1

; Bench-only SX1276 LoRa/FSM diagnostic. Automatically drives SAFE -> ARMED
; -> LAUNCH, then holds at LAUNCH. Never use this build for flight or with
; connected pyro hardware.
[env:debug_lora_autoflow]
build_flags =
  ${env:debug.build_flags}
  -D NURA_BENCH_FSM_AUTOFLOW=1
  -D NURA_BENCH_FSM_STOP_AT_LAUNCH=1
  -D NURA_BENCH_RADIO_TX_POWER_DBM=2
  -D NURA_BENCH_ALLOW_RADIO_INIT_FAILURE=1

; Bench-only SX1276 downlink diagnostic. LoRa transmits telemetry but leaves the
; RX/uplink command path disabled, including the SX1276 RF switch receive path.
; Never use this build with connected pyro hardware.
[env:debug_lora_no_uplink]
build_flags =
  ${env:debug.build_flags}
  -D NURA_BENCH_RADIO_TX_POWER_DBM=2
  -D NURA_BENCH_ALLOW_RADIO_INIT_FAILURE=1
  -D NURA_DISABLE_PYRO_OUTPUTS=1

; Bench-only full app with LoRa uplink enabled for resetting the FSM from GCS.
; Never use this build for flight or with connected pyro hardware.
[env:debug_lora_reset_uplink]
build_flags =
  ${env:debug.build_flags}
  -D NURA_BENCH_ENABLE_UPLINK=1
  -D NURA_ENABLE_BENCH_FSM_RESET_UPLINK=1
  -D NURA_BENCH_RADIO_TX_POWER_DBM=2
  -D NURA_BENCH_ALLOW_RADIO_INIT_FAILURE=1
  -D NURA_DISABLE_PYRO_OUTPUTS=1

; Full application build with the radio disabled.
[env:main_no_lora]
build_flags =
  ${env:main.build_flags}
  -D NURA_DISABLE_LORA=1

; Serial-diagnostic application build with the radio disabled.
[env:debug_no_lora]
build_flags =
  ${env:debug.build_flags}
  -D NURA_DISABLE_LORA=1
