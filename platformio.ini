[env:real_telemetry_tx]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = ${teensy_upload_retry.upload_protocol}
upload_command = ${teensy_upload_retry.upload_command}
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit LSM6DS@^4.7.4
  adafruit/Adafruit LIS3MDL@^1.2.5
  adafruit/Adafruit LIS331@^1.0.6
  adafruit/Adafruit MPL3115A2 Library@^2.1.2
  mikalhart/TinyGPSPlus@^1.1.0
  sandeepmistry/LoRa@^0.8.0
build_src_filter =
  -<*>
  +<main.cpp>
  +<app/app_config.cpp>
  +<app/flight_controller_app.cpp>
  +<core/logger/logger.cpp>
  +<core/recoverable_task/recoverable_task.cpp>
  +<core/scheduler.cpp>
  +<hal/battery_voltage_hal.cpp>
  +<hal/buzzer_hal.cpp>
  +<hal/h3lis331dl_hal.cpp>
  +<hal/lis3mdl_hal.cpp>
  +<hal/lsm6dso32_hal.cpp>
  +<hal/mpl3115a2_hal.cpp>
  +<hal/mosfet_pyro_hal.cpp>
  +<hal/panic_handler.cpp>
  +<hal/serial_log_output.cpp>
  +<hal/sx127x_lora_hal.cpp>
  +<hal/ublox_m6_gnss_hal.cpp>
  +<logging/flight_log_mirror_storage.cpp>
  +<logging/flight_log_ram_buffer.cpp>
  +<logging/flight_log_record.cpp>
  +<logging/program_flash_flight_log_storage.cpp>
  +<logging/sd_flight_log_storage.cpp>
  +<missions/flight_log_task.cpp>
  +<missions/fsm_task.cpp>
  +<missions/logger_task.cpp>
  +<missions/telemetry_task.cpp>
  +<missions/watchdog_task.cpp>
  +<sensors/barometer_task.cpp>
  +<sensors/gnss_task.cpp>
  +<sensors/high_g_imu_task.cpp>
  +<sensors/imu_task.cpp>
  +<sensors/magnetometer_task.cpp>
  +<sensors/power_sense_task.cpp>
build_flags =
  -I protocol/include
  -D LOG_LEVEL=3
  -D NURA_DISABLE_PROGRAM_FLASH_LOG=1
  -D NURA_BENCH_DISABLE_FLIGHT_LOG_TASK=1
  -D NURA_BENCH_RADIO_TX_POWER_DBM=2
  -D NURA_BENCH_TELEMETRY_FAST_PERIOD_MS=1000
  -D NURA_USE_SX127X_LORA=1
  -D NURA_FLIGHT_PCB_SX127X=1
  -D NURA_TELEMETRY_DOWNLINK_ONLY=1

