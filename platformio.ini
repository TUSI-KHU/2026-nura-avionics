; NURA avionics PCB bring-up build.
; Scope: Teensy 4.1, LEDs, buzzer, no-LoRa sensors, GPS, power sense, and
; bench-only manual pyro output pulses.

[platformio]
default_envs = pcb_bringup_no_lora

[teensy_upload_retry]
upload_protocol = custom
upload_command = python3 tools/platformio_teensy_upload_retry.py $SOURCE

[env:pcb_bringup_no_lora]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = ${teensy_upload_retry.upload_protocol}
upload_command = ${teensy_upload_retry.upload_command}
monitor_speed = 115200
lib_deps =
  adafruit/Adafruit LSM6DS@^4.7.4
  adafruit/Adafruit LIS3MDL@^1.2.5
  adafruit/Adafruit LIS331@^1.0.6
  adafruit/Adafruit MPL3115A2 Library@^2.1.2
  mikalhart/TinyGPSPlus@^1.1.0
build_src_filter =
  -<*>
  +<hal/battery_voltage_hal.cpp>
  +<hal/buzzer_hal.cpp>
  +<hal/h3lis331dl_hal.cpp>
  +<hal/lis3mdl_hal.cpp>
  +<hal/lsm6dso32_hal.cpp>
  +<hal/mosfet_pyro_hal.cpp>
  +<hal/mpl3115a2_hal.cpp>
  +<hal/ublox_m6_gnss_hal.cpp>
  +<../test/embedded/pcb_bringup_no_lora_main.cpp>
build_flags =
  -D NURA_ENABLE_PYRO_OUTPUTS=1
  -D NURA_PCB_BRINGUP_NO_LORA=1

[env:storage_logger_test]
platform = teensy
board = teensy41
framework = arduino
upload_protocol = ${teensy_upload_retry.upload_protocol}
upload_command = ${teensy_upload_retry.upload_command}
monitor_speed = 115200
build_src_filter =
